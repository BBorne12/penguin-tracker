<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Tracker - I Found One!</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #eef2f7;
            color: #2c3e50;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { margin: 5px 0; color: #1a252f; font-size: 24px; }
        .penguin-badge {
            background: #3498db;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            font-size: 14px;
            margin-top: 5px;
        }
        #map {
            height: 350px;
            width: 100%;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid #dcdde1;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #7f8c8d;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        button {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #27ae60; }
        .coords { text-align: center; color: #95a5a6; font-size: 12px; margin-top: -5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🐧 You Found a Penguin!</h1>
        <div class="penguin-badge" id="penguin-id">Detecting Tag...</div>
    </div>
    
    <p style="text-align: center; font-size: 14px; margin: 0;">Help track its journey! Drag the marker to where you found it. Previous discovery spots are linked on the map! Please hide it again for someone else to find. Try and take it far from where you found it. Thanks for playing!</p>
    
    <div id="map"></div>
    <div class="coords" id="coord-display">Latitude: -- | Longitude: --</div>
    
    <div class="input-group">
        <label for="finder-notes">Leave a note (Optional):</label>
        <textarea id="finder-notes" rows="3" placeholder="Tell us about its hiding spot or give it a name..."></textarea>
    </div>
    
    <button id="submit-btn" onclick="submitDiscovery()">Log Penguin Location</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://ylpgdjiucsserioafdas.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlscGdkaml1Y3NzZXJpb2FmZGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDk3NTcsImV4cCI6MjA5NjU4NTc1N30.TW94FMIi_X69FM3A1-Wg0wHmgyx0oJGEN7sEgewldiY";
    
    // Initialize Supabase Client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Get URL Parameters (?id=PENGUIN-001)
    const urlParams = new URLSearchParams(window.location.search);
    const penguinId = urlParams.get('id') || "Mystery Penguin";
    document.getElementById('penguin-id').innerText = `ID: ${penguinId}`;

    // Setup Map (Default zoomed out standard view)
    let defaultLat = 39.8283; 
    let defaultLng = -98.5795;
    const map = L.map('map').setView([defaultLat, defaultLng], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // This is the active user marker (the one they drag)
    let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

    function updateCoordsText(lat, lng) {
        document.getElementById('coord-display').innerText = `Lat: ${lat.toFixed(5)} | Lng: ${lng.toFixed(5)}`;
    }

    // Auto-detect phone GPS location for the active placement marker
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
            const uLat = position.coords.latitude;
            const uLng = position.coords.longitude;
            map.setView([uLat, uLng], 14);
            marker.setLatLng([uLat, uLng]);
            updateCoordsText(uLat, uLng);
        });
    }

    // Update coordinates on drag or click
    marker.on('dragend', function () {
        const pos = marker.getLatLng();
        updateCoordsText(pos.lat, pos.lng);
    });
    map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        updateCoordsText(e.latlng.lat, e.latlng.lng);
    });

    // --- FETCH HISTORY & DRAW LINES ---
    async function loadPenguinHistory() {
        if (penguinId === "Mystery Penguin") return; // Don't look up if no real ID

        // Grab historical rows from database ordered oldest to newest
        const { data: logs, error } = await supabaseClient
            .from('penguin_logs')
            .select('latitude, longitude, finder_note, created_at')
            .eq('penguin_id', penguinId)
            .order('created_at', { ascending: true });

        if (error) {
            console.error("Error loading path history:", error.message);
            return;
        }

        if (logs && logs.length > 0) {
            const pathCoordinates = [];

            // Define a gray/muted styling icon for historical milestones
            const historicalIcon = L.divIcon({
                className: 'custom-div-icon',
                html: "<div style='background-color:#95a5a6; width:12px; height:12px; border-radius:50%; border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.4);'></div>",
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });

            logs.forEach((log, index) => {
                const latLng = [log.latitude, log.longitude];
                pathCoordinates.push(latLng);

                // Add a static circle pin for past locations
                const dateObj = new Date(log.created_at).toLocaleDateString();
                const noteSnippet = log.finder_note ? `<br><i>"${log.finder_note}"</i>` : "";
                
                L.marker(latLng, { icon: historicalIcon })
                    .addTo(map)
                    .bindPopup(`<b>Stop #${index + 1}</b><br>Spotted: ${dateObj}${noteSnippet}`);
            });

            // Draw a dashed blue line connecting the dots chronologically
            const journeyLine = L.polyline(pathCoordinates, {
                color: '#3498db',
                weight: 3,
                opacity: 0.7,
                dashArray: '5, 10'
            }).addTo(map);

            // Dynamically snap the initial map view frame so it neatly contains the whole history path!
            map.fitBounds(journeyLine.getBounds(), { padding: [40, 40] });
        }
    }

    // Run the history loader immediately as soon as the page fires up
    loadPenguinHistory();


    // Handle form submission to Supabase
    async function submitDiscovery() {
        const currentPos = marker.getLatLng();
        const notes = document.getElementById('finder-notes').value;

        const submissionData = {
            penguin_id: penguinId,
            latitude: currentPos.lat,
            longitude: currentPos.lng,
            finder_note: notes
        };

        const { data, error } = await supabaseClient
            .from('penguin_logs')
            .insert([submissionData]);

        if (error) {
            alert("Oops! Something went wrong saving the location. Try again.");
            console.error("Supabase Error:", error.message);
        } else {
            alert(`Awesome! You successfully logged ${penguinId}.\nThank you for updating the map! Now find a new place to hide it so someone else can find it.`);
            document.getElementById('finder-notes').value = ""; 
            location.reload(); // Refresh the page so the newly added point gets integrated cleanly into the drawn line history
        }
    }
</script>

</body>
</html>
