<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Tracker - Arctic Adventure Mode</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Base Setup & CSS Resets */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #02060d;
            color: #ffffff;
            font-size: 11pt;
            line-height: 1.5;
        }

        /* Container & Mobile-first Responsive Canvas */
        .app-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            background: radial-gradient(circle at 50% 0%, #102a45 0%, #07111e 60%, #02060d 100%);
            min-height: 100vh;
        }

        /* Typography & Headings */
        h1, h2, h3, h4 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        h1 {
            font-size: 18pt;
            color: #e0f2fe;
            text-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }

        h2 {
            font-size: 12pt;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #7dd3fc;
            font-size: 8pt;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 3px;
            opacity: 0.8;
        }

        /* Layout Blocks */
        .layout-section {
            width: 100%;
            margin-top: 16px;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 16px;
        }

        .glass-card-inner {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
            margin-top: 12px;
        }

        /* Glowing & Status Elements */
        .aurora-glow {
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.6);
            font-weight: bold;
        }

        .ice-glow {
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid rgba(57, 255, 20, 0.3);
            color: #39ff14;
            border-radius: 20px;
            font-size: 8pt;
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.4);
            white-space: nowrap;
        }

        .warning-badge {
            display: block;
            padding: 12px;
            background: rgba(239, 68, 68, 0.07);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border-radius: 8px;
            font-size: 9pt;
            margin-top: 12px;
            line-height: 1.4;
        }

        /* Styled Input Form Elements */
        .note-textarea {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            font-family: inherit;
            font-size: 10pt;
            outline: none;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
            resize: none;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .note-textarea:focus {
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);
        }

        /* Hidden standard file inputs */
        .hidden-file-input {
            display: none !important;
        }

        /* Action Control Buttons */
        .btn-glow {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2) 0%, rgba(0, 229, 255, 0.2) 100%);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
            text-decoration: none;
            font-size: 10pt;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.2s ease, border-color 0.2s ease;
        }

        .btn-glow:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Style modifier for Camera interaction capture button */
        .btn-camera {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1) 0%, rgba(148, 163, 184, 0.1) 100%);
            border: 1px solid rgba(56, 189, 248, 0.25);
            margin-top: 6px;
            margin-bottom: 12px;
        }
        
        .btn-camera.photo-attached {
            border-color: #39ff14;
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
            background: linear-gradient(135deg, rgba(57, 255, 20, 0.15) 0%, rgba(0, 229, 255, 0.1) 100%);
        }

        /* Data List & Leaderboard Row Styles */
        .data-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .data-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .leaderboard-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .leaderboard-row:last-child {
            border-bottom: none;
        }

        .rank-badge {
            display: inline-block;
            width: 28px;
            font-weight: bold;
            color: #7dd3fc;
        }

        .p-name {
            font-weight: 600;
            color: #f8fafc;
        }

        .p-dist {
            font-weight: bold;
            color: #00e5ff;
            font-size: 10.5pt;
        }

        .label {
            font-size: 8.5pt;
            color: #94a3b8;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 10.5pt;
            color: #f8fafc;
        }

        .stat-subtext {
            display: block;
            font-size: 8pt;
            color: #94a3b8;
            text-align: right;
        }

        /* Interactive Map Container */
        #map {
            width: 100% !important;
            height: 220px !important;
            background: #030712 !important;
            border: 1px solid rgba(56, 189, 248, 0.2) !important;
            border-radius: 8px !important;
            margin: 12px 0 !important;
            z-index: 5;
        }
        
        .leaflet-tile {
            filter: hue-rotate(180deg) invert(90%) contrast(110%) brightness(95%);
        }
        .leaflet-bar {
            border: 1px solid rgba(56, 189, 248, 0.3) !important;
            box-shadow: none !important;
        }
        .leaflet-bar a {
            background-color: rgba(7, 17, 30, 0.8) !important;
            color: #00e5ff !important;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1) !important;
        }

        /* Frosted Glass Overlay Popup Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 13, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-card {
            background: linear-gradient(135deg, #0b1d33 0%, #040d1a 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .modal-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 11pt;
            margin: 16px 0;
            outline: none;
            text-align: center;
        }

        .modal-input:focus {
            border-color: #00e5ff;
        }

        /* Header Layout */
        .app-header {
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 14px;
            margin-bottom: 8px;
        }

        @media(min-width: 480px) {
            .app-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
            }
        }
    </style>
</head>
<body>

<div class="modal-overlay" id="first-find-modal">
    <div class="modal-card">
        <span style="font-size: 40pt; display: block; margin-bottom: 8px;">🥚 ➔ 🐧</span>
        <h2 style="color: #39ff14; font-size: 14pt; text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);">First Discovery!</h2>
        <p style="font-size: 9.5pt; color: #94a3b8; line-height: 1.5; margin: 6px 0 0 0;">
            You found a completely new penguin that has never been logged before! Give it a custom name below to officially launch its adventure.
        </p>
        
        <input type="text" id="modal-custom-name" class="modal-input" placeholder="e.g., Captain Waddles, Sir Flappy...">
        
        <button onclick="saveCustomNameFromModal()" class="btn-glow">Save Name & Start Journey!</button>
    </div>
</div>

<div class="app-container">
    
    <div class="app-header">
        <div>
            <div class="subtitle">The Traveling Penguin Game</div>
            <h1>PENGUIN TRACKER</h1>
        </div>
        <div style="margin-top: 8px;">
