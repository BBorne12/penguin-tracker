<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Tracker - Professional Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Essential styles for stability */
        body { margin: 0; background: #02060d; color: white; font-family: sans-serif; }
        .app-container { max-width: 600px; margin: auto; padding: 20px; }
        #map { width: 100%; height: 300px; border-radius: 12px; background: #0f172a; margin: 15px 0; }
        .leaderboard-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #1e293b; cursor: pointer; }
        .leaderboard-row:hover { background: #1e293b; }
        .btn { padding: 10px 20px; background: #0ea5e9; border: none; color: white; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>PENGUIN TRACKER v2.7</h1>
        <div id="status" style="color: #00e5ff;"></div>
        <div id="map"></div>
        <button class="btn" onclick="buildLeaderboard()">Refresh Leaderboard</button>
        <div id="leaderboard-output"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://ylpgdjiucsserioafdas.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlscGdkaml1Y3NzZXJpb2FmZGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDk3NTcsImV4cCI6MjA5NjU4NTc1N30.TW94FMIi_X69FM3A1-Wg0wHmgyx0oJGEN7sEgewldiY";
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const map = L.map('map').setView([39.8283, -98.5795], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        let historyLayer = L.layerGroup().addTo(map);
        let currentLine = null;

        async function buildLeaderboard() {
            const { data, error } = await supabase.from('penguin_logs').select('penguin_id').order('created_at', { ascending: false });
            if (error) { console.error(error); return; }
            
            const unique = [...new Set(data.map(i => i.penguin_id))];
            const output = document.getElementById('leaderboard-output');
            output.innerHTML = "<h2>Leaderboard</h2>";
            unique.forEach(id => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                row.innerHTML = `<span>🐧 ${id}</span>`;
                row.onclick = () => renderHistory(id);
                output.appendChild(row);
            });
        }

        async function renderHistory(id) {
            document.getElementById('status').innerText = "Loading " + id + "...";
            historyLayer.clearLayers();
            if (currentLine) map.removeLayer(currentLine);

            const { data: logs } = await supabase.from('penguin_logs').select('latitude, longitude').eq('penguin_id', id).order('created_at', { ascending: true });
            
            if (!logs || logs.length === 0) return;

            const path = logs.map(l => [l.latitude, l.longitude]);
            path.forEach(c => L.marker(c).addTo(historyLayer));
            
            currentLine = L.polyline(path, { color: '#00e5ff' }).addTo(map);
            
            map.invalidateSize();
            map.fitBounds(currentLine.getBounds(), { padding: [50, 50] });
            document.getElementById('status').innerText = "Viewing: " + id;
        }

        buildLeaderboard();
    </script>
</body>
</html>
