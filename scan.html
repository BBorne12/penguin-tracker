<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deployment Scanner | Penguin Tracker™</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 style=%22filter: grayscale(100%);%22>🐧</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #02060d; color: #ffffff;
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }

        .header {
            background: rgba(2, 6, 13, 0.9); backdrop-filter: blur(10px);
            padding: 16px; text-align: center; border-bottom: 1px solid rgba(217, 70, 239, 0.3);
            z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h1 { margin: 0; font-size: 14pt; color: #fae8ff; letter-spacing: 1px; text-transform: uppercase; }
        .subtitle { font-size: 8.5pt; color: #d946ef; letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

        #reader-container {
            flex: 1; width: 100%; position: relative; background: #000;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        /* Overriding the default library styles for a sleeker look */
        #reader { width: 100%; border: none !important; }
        #reader__scan_region { background: #000; }
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_swaplink { color: #fff !important; }

        .overlay-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); z-index: 50; padding: 20px; text-align: center;
        }

        .btn-glow {
            padding: 16px 32px; font-size: 12pt;
            background: linear-gradient(135deg, rgba(217, 70, 239, 0.2) 0%, rgba(162, 28, 175, 0.2) 100%);
            border: 1px solid rgba(217, 70, 239, 0.6); border-radius: 8px; color: #ffffff;
            font-weight: bold; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 0 20px rgba(217, 70, 239, 0.3); transition: all 0.2s ease;
        }
        .btn-glow:active { transform: scale(0.95); }

        .status-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(2, 6, 13, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px;
            padding: 16px 24px; width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            z-index: 100; transition: all 0.3s ease;
        }

        .status-icon { font-size: 24pt; margin-bottom: 8px; display: block; }
        .status-text { font-size: 11pt; font-weight: 600; color: #e0f2fe; }
        .status-subtext { font-size: 9pt; color: #94a3b8; margin-top: 4px; font-family: monospace; }

        .state-idle { border-color: rgba(56, 189, 248, 0.3); }
        .state-working { border-color: rgba(249, 115, 22, 0.6); box-shadow: 0 0 20px rgba(249, 115, 22, 0.2); }
        .state-success { border-color: rgba(57, 255, 20, 0.6); box-shadow: 0 0 20px rgba(57, 255, 20, 0.2); }
        .state-error { border-color: rgba(239, 68, 68, 0.6); box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }

    </style>
</head>
<body>

    <div class="header">
        <h1>Field Deployment</h1>
        <div class="subtitle">Auto-Hide Scanner Active</div>
    </div>

    <div id="reader-container">
        <div id="reader"></div>
        
        <!-- Start Screen Overlay (Required by iOS/Safari to request camera permissions properly) -->
        <div id="start-overlay" class="overlay-ui">
            <span style="font-size: 40pt; margin-bottom: 16px;">📷</span>
            <p style="color: #cbd5e1; margin-bottom: 32px; line-height: 1.5; font-size: 11pt;">
                Point at a Tracker QR code to automatically lock GPS coordinates and log a secure deployment hide.
            </p>
            <button class="btn-glow" onclick="initializeScanner()">Initialize Optics</button>
        </div>

        <div id="status-panel" class="status-panel state-idle" style="display: none;">
            <span id="status-icon" class="status-icon">🎯</span>
            <div id="status-text" class="status-text">Scanning for Targets...</div>
            <div id="status-subtext" class="status-subtext">Align QR code within frame</div>
        </div>
    </div>

<script>
    // --- CONNECT CREDENTIALS ---
    const SUPABASE_URL = "https://ylpgdjiucsserioafdas.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlscGdkaml1Y3NzZXJpb2FmZGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDk3NTcsImV4cCI6MjA5NjU4NTc1N30.TW94FMIi_X69FM3A1-Wg0wHmgyx0oJGEN7sEgewldiY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let html5QrCode;
    let isProcessing = false;

    function updateStatus(state, icon, text, subtext) {
        const panel = document.getElementById('status-panel');
        panel.className = `status-panel state-${state}`;
        document.getElementById('status-icon').innerText = icon;
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-subtext').innerText = subtext;
    }

    function initializeScanner() {
        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('status-panel').style.display = 'block';

        html5QrCode = new Html5Qrcode("reader");
        
        const config = { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        };

        // Prefer the back camera for mobile scanning
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
            updateStatus('error', '⚠️', 'Camera Access Denied', 'Please check browser permissions.');
        });
    }

    async function onScanSuccess(decodedText, decodedResult) {
        // Prevent double-scanning the same code while processing
        if (isProcessing) return;

        try {
            // Attempt to parse the scanned text as a URL to extract ID and Tag
            const url = new URL(decodedText);
            const pId = url.searchParams.get("id");
            const tag = url.searchParams.get("tag");

            if (pId && pId.startsWith("Penguin-")) {
                isProcessing = true;
                html5QrCode.pause();
                
                if (navigator.vibrate) navigator.vibrate(50); // Haptic feedback on detection
                
                await processHideLocation(pId, tag);
            }
        } catch (e) {
            // Scanned a non-URL or invalid QR code. Ignore it silently.
        }
    }

    async function processHideLocation(pId, tag) {
        updateStatus('working', '📡', `Locking GPS for ${pId}...`, 'Acquiring satellites');

        if (!navigator.geolocation) {
            triggerError("GPS not supported by device.");
            return;
        }

        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            updateStatus('working', '☁️', `Uploading Deployment...`, `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`);

            // Execute the secure DB insertion
            const { error } = await supabaseClient.from('penguin_logs').insert([{
                penguin_id: pId,
                secret_tag: tag, // Passing the tag verifies authorization if DB policies are strict
                finder_note: '[ADMIN HIDE LOCATION]',
                latitude: lat,
                longitude: lng
            }]);

            if (error) {
                triggerError(`Database rejection: ${error.message}`);
            } else {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Success double-buzz
                updateStatus('success', '✅', 'Hide Successfully Logged!', `${pId} deployed to grid.`);
                
                // Auto-resume scanner after 2.5 seconds
                setTimeout(() => {
                    isProcessing = false;
                    html5QrCode.resume();
                    updateStatus('idle', '🎯', 'Scanning for Targets...', 'Align QR code within frame');
                }, 2500);
            }

        }, (error) => {
            triggerError("GPS Signal Lost. Ensure location services are enabled.");
        }, { enableHighAccuracy: true, timeout: 10000 });
    }

    function triggerError(msg) {
        if (navigator.vibrate) navigator.vibrate(500); // Long buzz for error
        updateStatus('error', '❌', 'Deployment Failed', msg);
        
        // Auto-resume scanner after error
        setTimeout(() => {
            isProcessing = false;
            html5QrCode.resume();
            updateStatus('idle', '🎯', 'Scanning for Targets...', 'Align QR code within frame');
        }, 4000);
    }
</script>

</body>
</html>
